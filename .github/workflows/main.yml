on: push
name: Notebook check

# A lightweight check that needs no data, packages or API keys: notebooks are valid,
# every code cell parses, and no credentials are committed. It does not run the
# notebooks. Warnings flag notebooks that were not run top to bottom.
jobs:
  check:
    name: validate notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install nbformat
      - run: python .github/check_notebooks.py
